<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JRD CV Maker | Connexion</title>
    <link rel="icon" href="assets/images/icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
    <style>
        
        body {
            /* On réutilise l'image de fond pour la cohérence visuelle */
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('assets/images/backimg.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
        }

                                                               
        .login-container {
            background: rgba(255, 255, 255, 0.08); /* Fond translucide */
            backdrop-filter: blur(15px); /* Effet de flou */
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 50px 40px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        
        h2 {
            font-family: 'Playfair Display', serif;
            color: #fff;
            font-size: 2.2rem;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        /* --- Formulaire --- */
        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            text-align: left;
        }

        label {
            display: block;
            color: aqua;
            font-size: 0.75rem;
            font-weight: 500;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            border-color: aqua;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }


        button {
            margin-top: 10px;
            padding: 14px;
            background: aqua;
            color: #001a1a;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.4s;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }

        button:hover {
            transform: scale(1.03);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.6);
            background: #00e5e5;
        }
        h5 {
            margin-top: 25px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 300;
            font-size: 0.9rem;
        }

        h5 a {
            color: aqua;
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
        }

        h5 a:hover {
            text-shadow: 0 0 8px aqua;
            text-decoration: underline;
        }

        .error-message {
            background: rgba(255, 50, 50, 0.2);
            color: #ff6b6b;
            border: 1px solid rgba(255, 50, 50, 0.5);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <h2>Log in</h2>
        
        <div id="error-box" class="error-message"></div>

        <form action="/api/connection" method="post">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="votre@email.com" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••••••" required>
            </div>

            <button type="submit">Connect</button>

            <h5>Pas de compte ? <a href="inscription.html">Sign up</a></h5>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error') === 'invalid_credentials') {
            const errorBox = document.getElementById('error-box');
            errorBox.textContent = 'Identifiants invalides. Veuillez réessayer.';
            errorBox.style.display = 'block';
        }
    </script>
</body>
</html>
